name: PackingStar variant continuous-cap research run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packingstar-variant-cap-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.2.6 scipy==1.15.3

      - name: Fetch the pinned PackingStar source
        run: |
          set -euo pipefail
          python kissing/dim13/packingstar/fetch_source.py \
            --archive /tmp/packingstar-variant.zip \
            --extract-dir /tmp/packingstar-variant
          matrix="$(find /tmp/packingstar-variant -type f \
            -name '13D-1146-cosmatrix_variant_1.npy' -print -quit)"
          test -n "$matrix"
          echo "MATRIX=$matrix" >> "$GITHUB_ENV"

      - name: Search continuous rank-7 cap trades
        run: |
          set -euo pipefail
          python kissing/dim13/packingstar/search_variant_cap_continuous.py \
            --matrix "$MATRIX" \
            --output-dir /tmp/variant_cap_continuous_results \
            --progress-log /tmp/variant_cap_progress.log \
            --random-samples 60000 \
            --max-new 2200 \
            --per-mask 8 \
            --greedy-rounds 2200 \
            --milp-vertices 1050 \
            --milp-seconds 360 \
            | tee /tmp/variant_cap_continuous.log

      - name: Upload research outputs without changing the branch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packingstar-variant-cap-${{ github.sha }}
          if-no-files-found: warn
          path: |
            /tmp/variant_cap_continuous_results
            /tmp/variant_cap_progress.log
            /tmp/variant_cap_continuous.log
