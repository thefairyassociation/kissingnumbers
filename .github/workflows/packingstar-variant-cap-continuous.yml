name: Search PackingStar variant continuous cap

on:
  push:
    branches:
      - codex/d13-packingstar-exact
    paths:
      - .github/workflows/packingstar-variant-cap-continuous.yml
      - kissing/dim13/packingstar/search_variant_cap_continuous.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packingstar-variant-cap-continuous
  cancel-in-progress: false

jobs:
  search:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: codex/d13-packingstar-exact
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Download PackingStar's public dimension-13 matrices
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/packingstar-variant
          mkdir -p /tmp/packingstar-variant/source
          curl --fail --location --retry 5 --retry-all-errors \
            --output /tmp/packingstar-variant/source.zip \
            https://raw.githubusercontent.com/CDM1619/PackingStar/main/13D_rational_configurations/13D_rational_configurations.zip
          unzip -q /tmp/packingstar-variant/source.zip -d /tmp/packingstar-variant/source
          find /tmp/packingstar-variant/source -type f -maxdepth 4 -print | sort

      - name: Search continuous rank-7 cap trades
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(find /tmp/packingstar-variant/source -type f -name '13D-1146-cosmatrix_variant_1.npy' -print -quit)"
          test -n "$matrix"
          rm -rf kissing/dim13/packingstar/variant_cap_continuous_results
          python kissing/dim13/packingstar/search_variant_cap_continuous.py \
            --matrix "$matrix" \
            --output-dir kissing/dim13/packingstar/variant_cap_continuous_results \
            --progress-log kissing/dim13/variant_cap_progress.log \
            --random-samples 60000 \
            --max-new 2200 \
            --per-mask 8 \
            --greedy-rounds 2200 \
            --milp-vertices 1050 \
            --milp-seconds 360 \
            | tee kissing/dim13/packingstar/variant_cap_continuous_results/raw_run.log

      - name: Upload checkpoints, pool, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packingstar-variant-cap-continuous
          if-no-files-found: warn
          path: |
            kissing/dim13/packingstar/variant_cap_continuous_results
            kissing/dim13/variant_cap_progress.log

      - name: Commit completed search output
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kissing/dim13/packingstar/variant_cap_continuous_results \
                  kissing/dim13/variant_cap_progress.log
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Record PackingStar variant continuous cap search [skip ci]'
          git pull --rebase origin codex/d13-packingstar-exact
          git push origin HEAD:codex/d13-packingstar-exact
