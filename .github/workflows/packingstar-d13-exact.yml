name: PackingStar d13 exact reconstruction

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packingstar-d13-exact
  cancel-in-progress: false

jobs:
  analyze:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/d13-packingstar-exact

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact-analysis dependencies
        run: python -m pip install --upgrade numpy scipy sympy

      - name: Download the public PackingStar archive
        run: |
          set -euxo pipefail
          mkdir -p /tmp/packingstar
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://raw.githubusercontent.com/CDM1619/PackingStar/main/13D_rational_configurations/13D_rational_configurations.zip' \
            --output /tmp/packingstar.zip
          sha256sum /tmp/packingstar.zip | tee /tmp/packingstar-archive.sha256
          unzip -q /tmp/packingstar.zip -d /tmp/packingstar
          find /tmp/packingstar -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Reconstruct and verify exact Gram certificates
        run: |
          set -euxo pipefail
          rm -rf kissing/dim13/packingstar/results
          mkdir -p kissing/dim13/packingstar/results
          cp /tmp/packingstar-archive.sha256 kissing/dim13/packingstar/results/archive.sha256
          python kissing/dim13/packingstar/analyze_packingstar.py \
            --input-dir /tmp/packingstar \
            --output-dir kissing/dim13/packingstar/results \
            --progress-log kissing/dim13/progress.log 2>&1 | tee kissing/dim13/packingstar/results/raw_run.log

      - name: Decode the exact antipodal E6/E7 fiber product
        run: |
          set -euxo pipefail
          python kissing/dim13/packingstar/analyze_fiber.py \
            --matrix /tmp/packingstar/13D_rational_configurations/13D-1146-cosmatrix.npy \
            --output-dir kissing/dim13/packingstar/results \
            --expensive 2>&1 | tee kissing/dim13/packingstar/results/fiber_raw_run.log

      - name: Decode the exact non-antipodal fiber variant
        run: |
          set -euxo pipefail
          python kissing/dim13/packingstar/analyze_fiber_variant.py \
            --matrix /tmp/packingstar/13D_rational_configurations/13D-1146-cosmatrix_variant_1.npy \
            --output-dir kissing/dim13/packingstar/results \
            --expensive 2>&1 | tee kissing/dim13/packingstar/results/variant_fiber_raw_run.log

      - name: Commit reproducible outputs
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kissing/dim13/packingstar kissing/dim13/progress.log
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Analyze both PackingStar dimension-13 fiber constructions [skip d13 packingstar]'
          git pull --rebase origin codex/d13-packingstar-exact
          git push origin HEAD:codex/d13-packingstar-exact
