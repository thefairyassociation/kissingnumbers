name: ZE99 continuous auxiliary-layer research run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ze99-aux-continuous-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.2.6 scipy==1.15.3

      - name: Search finite slab vertices and continuous 25-codes
        run: |
          set -euo pipefail
          python kissing/dim13/search_ze99_aux_continuous.py \
            --output-dir /tmp/ze99_aux_continuous_results \
            --progress-log /tmp/ze99_aux_continuous_progress.log \
            --random-directions 1800 \
            --fixed-point-rounds 3 \
            --greedy-rounds 2200 \
            --exact-seconds 180 \
            --milp-vertices 1100 \
            --milp-seconds 240 \
            --restarts 10 \
            --lbfgs-maxiter 280 \
            | tee /tmp/ze99_aux_continuous.log

      - name: Upload research outputs without changing the branch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ze99-aux-continuous-${{ github.sha }}
          if-no-files-found: warn
          path: |
            /tmp/ze99_aux_continuous_results
            /tmp/ze99_aux_continuous_progress.log
            /tmp/ze99_aux_continuous.log
