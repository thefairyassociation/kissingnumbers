name: Search continuous ZE99 auxiliary layer

on:
  push:
    branches:
      - codex/d13-packingstar-exact
    paths:
      - .github/workflows/ze99-aux-continuous.yml
      - kissing/dim13/search_ze99_aux_continuous.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ze99-aux-continuous
  cancel-in-progress: false

jobs:
  search:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: codex/d13-packingstar-exact
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install search dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Search finite slab vertices and continuous 25-codes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kissing/dim13/ze99_aux_continuous_results
          python kissing/dim13/search_ze99_aux_continuous.py \
            --output-dir kissing/dim13/ze99_aux_continuous_results \
            --progress-log kissing/dim13/ze99_aux_continuous_progress.log \
            --random-directions 1800 \
            --fixed-point-rounds 3 \
            --greedy-rounds 2200 \
            --exact-seconds 180 \
            --milp-vertices 1100 \
            --milp-seconds 240 \
            --restarts 10 \
            --lbfgs-maxiter 280 \
            | tee kissing/dim13/ze99_aux_continuous_results/raw_run.log

      - name: Upload checkpoints and numerical candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ze99-aux-continuous
          if-no-files-found: warn
          path: |
            kissing/dim13/ze99_aux_continuous_results
            kissing/dim13/ze99_aux_continuous_progress.log

      - name: Commit completed search output
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kissing/dim13/ze99_aux_continuous_results \
                  kissing/dim13/ze99_aux_continuous_progress.log
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Record continuous ZE99 auxiliary-layer search [skip ci]'
          git pull --rebase origin codex/d13-packingstar-exact
          git push origin HEAD:codex/d13-packingstar-exact
