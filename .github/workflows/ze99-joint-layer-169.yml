name: Exact joint ZE99 169-point layer search

on:
  push:
    branches:
      - codex/d13-joint-layer-169
    paths:
      - .github/workflows/ze99-joint-layer-169.yml
      - kissing/dim13/search_ze99_joint_layer.py
      - kissing/dim13/ze99_aux_core.py
      - kissing/dim13/constructions/ze99.py
      - kissing/dim13/data/ze99_structure.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ze99-joint-layer-169-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-search:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: codex/d13-joint-layer-169
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact finite-search dependencies
        run: python -m pip install --disable-pip-version-check numpy ortools

      - name: Search for an exact 169-point half-height layer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kissing/dim13/ze99_joint_layer_results
          mkdir -p kissing/dim13/ze99_joint_layer_results
          python kissing/dim13/search_ze99_joint_layer.py \
            --output-dir kissing/dim13/ze99_joint_layer_results \
            --progress-log kissing/dim13/ze99_joint_layer_progress.log \
            --time-limit 1500 \
            --workers 4 \
            --seed 51 \
            | tee kissing/dim13/ze99_joint_layer_results/raw_run.log

      - name: Validate exact output contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('kissing/dim13/ze99_joint_layer_results')
          analysis = json.loads((root / 'analysis.json').read_text())
          assert analysis['status'] == 'completed'
          assert analysis['enumeration']['candidate_count'] == 4248
          assert analysis['enumeration']['signed_direction_norm_squared_distribution'] == {
              '1': 24,
              '3': 128,
              '12': 4096,
          }
          assert analysis['binary_distance_model']['missing_forbidden_pairs'] == 0
          assert analysis['binary_distance_model']['extraneous_compatible_pairs'] == 0
          assert analysis['solver']['status'] in {
              'INFEASIBLE', 'FEASIBLE', 'OPTIMAL', 'UNKNOWN'
          }
          if analysis['beats_record']:
              assert analysis['candidate_count'] >= 1155
              assert analysis['exact_verification']['ok'] is True
              config = root / analysis['configuration']
              assert config.is_file()
              assert (root / 'best.json').is_file()
          else:
              assert analysis['candidate_count'] == 1154
          print({
              'solver_status': analysis['solver']['status'],
              'beats_record': analysis['beats_record'],
              'candidate_count': analysis['candidate_count'],
          })
          PY

      - name: Promote an exact record witness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          root = Path('kissing/dim13/ze99_joint_layer_results')
          analysis = json.loads((root / 'analysis.json').read_text())
          if analysis['beats_record']:
              shutil.copyfile(root / 'best.json', Path('kissing/dim13/best.json'))
              print('promoted exact record witness')
          else:
              print('no exact record witness to promote')
          PY

      - name: Upload results and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ze99-joint-layer-169
          if-no-files-found: warn
          path: |
            kissing/dim13/ze99_joint_layer_results
            kissing/dim13/ze99_joint_layer_progress.log
            kissing/dim13/search_ze99_joint_layer.py
            kissing/dim13/ze99_aux_core.py
            kissing/dim13/constructions/ze99.py
            kissing/dim13/data/ze99_structure.json

      - name: Commit completed outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kissing/dim13/ze99_joint_layer_results \
                  kissing/dim13/ze99_joint_layer_progress.log
          if ! git diff --quiet -- kissing/dim13/best.json; then
            git add kissing/dim13/best.json
          fi
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Record exact joint ZE99 layer search [skip ci]'
          git pull --rebase origin codex/d13-joint-layer-169
          git push origin HEAD:codex/d13-joint-layer-169
