name: Exact PackingStar dimension-13 reconstruction

on:
  push:
    branches:
      - codex/d13-packingstar-exact
    paths:
      - .github/workflows/d13-packingstar-exact.yml
      - kissing/dim13/packingstar/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d13-packingstar-exact
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: codex/d13-packingstar-exact
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact and numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy scipy

      - name: Download the public PackingStar dimension-13 archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/packingstar13
          mkdir -p /tmp/packingstar13/source
          curl --fail --location --retry 5 --retry-all-errors \
            --output /tmp/packingstar13/source.zip \
            https://raw.githubusercontent.com/CDM1619/PackingStar/main/13D_rational_configurations/13D_rational_configurations.zip
          unzip -q /tmp/packingstar13/source.zip -d /tmp/packingstar13/source
          sha256sum /tmp/packingstar13/source.zip
          find /tmp/packingstar13/source -type f -maxdepth 4 -print | sort

      - name: Reconstruct and verify in exact arithmetic
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kissing/dim13/packingstar/results
          # Keep the committed diagnostic exhaustive; use a bounded copy in CI so
          # the exact proof, rather than thousands of optional LP solves, controls runtime.
          cp kissing/dim13/packingstar/analyze_packingstar.py /tmp/analyze_packingstar.py
          sed -i 's/starts: int = 64/starts: int = 12/' /tmp/analyze_packingstar.py
          sed -i 's/for iteration in range(40)/for iteration in range(16)/' /tmp/analyze_packingstar.py
          python /tmp/analyze_packingstar.py \
            --input-dir /tmp/packingstar13/source \
            --output-dir kissing/dim13/packingstar/results \
            --progress-log kissing/dim13/progress.log \
            | tee kissing/dim13/packingstar/workflow_output.txt

      - name: Upload exact certificates and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d13-packingstar-exact
          if-no-files-found: warn
          path: |
            kissing/dim13/packingstar/results
            kissing/dim13/packingstar/workflow_output.txt
            kissing/dim13/progress.log

      - name: Commit verified results to the research branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kissing/dim13/packingstar/results \
                  kissing/dim13/packingstar/workflow_output.txt \
                  kissing/dim13/progress.log
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Record exact PackingStar dimension-13 reconstruction [skip ci]'
          git push origin HEAD:codex/d13-packingstar-exact
