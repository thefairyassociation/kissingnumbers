name: Exact ZE99 Steiner-switch augmentation

on:
  push:
    branches:
      - codex/d13-steiner-switch-record
    paths:
      - .github/workflows/ze99-steiner-switch-record.yml
      - kissing/dim13/search_ze99_steiner_switch.py
      - kissing/dim13/constructions/ze99.py
      - kissing/dim13/data/ze99_structure.json
  pull_request:
    branches:
      - codex/d13-steiner-switch-record
    paths:
      - .github/workflows/ze99-steiner-switch-record.yml
      - kissing/dim13/search_ze99_steiner_switch.py
      - kissing/dim13/constructions/ze99.py
      - kissing/dim13/data/ze99_structure.json
      - kissing/dim13/STEINER_SWITCH_TRIGGER.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ze99-steiner-switch-record-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-search:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out search ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'codex/d13-steiner-switch-record' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact-search dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Exhaust the integer shell and verify any witness exactly
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kissing/dim13/ze99_steiner_switch_results
          python kissing/dim13/search_ze99_steiner_switch.py \
            --output-dir kissing/dim13/ze99_steiner_switch_results \
            --progress-log kissing/dim13/ze99_steiner_switch_progress.log \
            --near-misses 30 \
            | tee kissing/dim13/ze99_steiner_switch_results/raw_run.log

      - name: Validate generated research result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("kissing/dim13/ze99_steiner_switch_results")
          analysis = json.loads((root / "analysis.json").read_text())
          assert analysis["status"] == "completed"
          assert analysis["integer_shell_reduction"]["exact_family_exhaustive"] is True
          assert analysis["integer_shell_reduction"]["integer_candidate_shell_size"] == 8192
          assert analysis["search"]["tested"] == 8192 or analysis["beats_record"]
          if analysis["beats_record"]:
              assert analysis["candidate_count"] == 1155
              assert analysis["witness"]["exact_verification"]["ok"] is True
              assert (root / "best_exact_1155.json").is_file()
              assert (root / "best.json").is_file()
          else:
              assert analysis["candidate_count"] == 1154
          print(
              "validated",
              {
                  "beats_record": analysis["beats_record"],
                  "candidate_count": analysis["candidate_count"],
                  "tested": analysis["search"]["tested"],
              },
          )
          PY

      - name: Promote an exact record witness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          result = Path("kissing/dim13/ze99_steiner_switch_results")
          analysis = json.loads((result / "analysis.json").read_text())
          if analysis["beats_record"]:
              shutil.copyfile(result / "best.json", Path("kissing/dim13/best.json"))
              print("promoted exact 1155-vector witness")
          else:
              print("integer switch family exhausted without a record")
          PY

      - name: Upload exact outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ze99-steiner-switch-record
          if-no-files-found: warn
          path: |
            kissing/dim13/ze99_steiner_switch_results
            kissing/dim13/ze99_steiner_switch_progress.log

      - name: Commit completed outputs
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kissing/dim13/ze99_steiner_switch_results \
                  kissing/dim13/ze99_steiner_switch_progress.log \
                  kissing/dim13/best.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Record exact ZE99 Steiner-switch search [skip ci]'
          git pull --rebase origin codex/d13-steiner-switch-record
          git push origin HEAD:codex/d13-steiner-switch-record
