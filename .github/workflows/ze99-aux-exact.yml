name: ZE99 auxiliary exact search

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ze99-aux-exact
  cancel-in-progress: false

jobs:
  search:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/d13-packingstar-exact

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --upgrade numpy

      - name: Exhaust the exact ternary auxiliary family
        run: |
          set -euxo pipefail
          rm -rf kissing/dim13/ze99_aux_results
          mkdir -p kissing/dim13/ze99_aux_results
          python kissing/dim13/search_ze99_aux.py \
            --output-dir kissing/dim13/ze99_aux_results \
            --time-limit 1500 \
            --progress-log kissing/dim13/ze99_aux_progress.log \
            2>&1 | tee kissing/dim13/ze99_aux_results/ci_run.log

      - name: Commit exact outputs
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kissing/dim13/ze99_aux_results kissing/dim13/ze99_aux_progress.log
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Search exact ZE99 auxiliary ternary family [skip ze99 aux]'
          git pull --rebase origin codex/d13-packingstar-exact
          git push origin HEAD:codex/d13-packingstar-exact
