name: PackingStar partition-orbit research run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packingstar-partition-orbits-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.2.6 scipy==1.15.3 sympy==1.14.0

      - name: Fetch the pinned PackingStar source
        run: |
          set -euo pipefail
          python kissing/dim13/packingstar/fetch_source.py \
            --archive /tmp/packingstar-partitions.zip \
            --extract-dir /tmp/packingstar-partitions
          matrix="$(find /tmp/packingstar-partitions -type f \
            -name '13D-1146-cosmatrix_variant_1.npy' -print -quit)"
          test -n "$matrix"
          echo "MATRIX=$matrix" >> "$GITHUB_ENV"

      - name: Construct and verify all partition-orbit variants
        run: |
          set -euo pipefail
          python kissing/dim13/packingstar/search_partition_orbits.py \
            --matrix "$MATRIX" \
            --output-dir /tmp/partition_orbit_results \
            | tee /tmp/partition_orbit_results.log

      - name: Upload research outputs without changing the branch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packingstar-partition-orbits-${{ github.sha }}
          if-no-files-found: warn
          path: |
            /tmp/partition_orbit_results
            /tmp/partition_orbit_results.log
