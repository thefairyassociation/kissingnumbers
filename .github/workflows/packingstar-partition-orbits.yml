name: PackingStar partition-orbit search

on:
  push:
    branches:
      - codex/d13-packingstar-exact
    paths:
      - kissing/dim13/packingstar/search_partition_orbits.py
      - .github/workflows/packingstar-partition-orbits.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packingstar-partition-orbits
  cancel-in-progress: false

jobs:
  search:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: codex/d13-packingstar-exact
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install exact and numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy sympy scipy

      - name: Download PackingStar's non-antipodal dimension-13 matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/packingstar_partition_orbits
          mkdir -p /tmp/packingstar_partition_orbits/unpacked
          curl --fail --location --retry 5 --retry-all-errors \
            --output /tmp/packingstar_partition_orbits/source.zip \
            https://raw.githubusercontent.com/CDM1619/PackingStar/main/13D_rational_configurations/13D_rational_configurations.zip
          unzip -q /tmp/packingstar_partition_orbits/source.zip \
            -d /tmp/packingstar_partition_orbits/unpacked
          find /tmp/packingstar_partition_orbits/unpacked -maxdepth 6 -type f -print | sort
          MATRIX="$(find /tmp/packingstar_partition_orbits/unpacked -maxdepth 6 \
            -type f -name '13D-1146-cosmatrix_variant_1.npy' | head -n 1)"
          test -n "$MATRIX"
          echo "MATRIX=$MATRIX" >> "$GITHUB_ENV"
          sha256sum "$MATRIX"

      - name: Construct and verify all 13 E6 partition-orbit variants
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kissing/dim13/packingstar/partition_orbit_results
          python kissing/dim13/packingstar/search_partition_orbits.py \
            --matrix "$MATRIX" \
            --output-dir kissing/dim13/packingstar/partition_orbit_results \
            | tee /tmp/packingstar_partition_orbits/raw_run.log
          cp /tmp/packingstar_partition_orbits/raw_run.log \
            kissing/dim13/packingstar/partition_orbit_results/raw_run.log

      - name: Upload exact certificates and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packingstar-partition-orbit-results
          if-no-files-found: warn
          path: kissing/dim13/packingstar/partition_orbit_results

      - name: Commit completed results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kissing/dim13/packingstar/partition_orbit_results
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Record exact PackingStar partition-orbit search [skip ci]'
          for attempt in 1 2 3 4; do
            git pull --rebase origin codex/d13-packingstar-exact
            if git push origin HEAD:codex/d13-packingstar-exact; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
