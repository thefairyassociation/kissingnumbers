name: ZE99 auxiliary one-for-two trade scan

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ze99-aux-trade-scan
  cancel-in-progress: false

jobs:
  scan:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/d13-packingstar-exact

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical search dependencies
        run: python -m pip install --upgrade numpy scipy

      - name: Scan one-axis-to-two-point trades
        run: |
          set -euxo pipefail
          rm -rf kissing/dim13/ze99_aux_trade_results
          mkdir -p kissing/dim13/ze99_aux_trade_results
          python kissing/dim13/search_ze99_aux_trade_scan.py \
            --output-dir kissing/dim13/ze99_aux_trade_results \
            --samples 384 \
            --progress-log kissing/dim13/ze99_aux_trade_progress.log \
            2>&1 | tee kissing/dim13/ze99_aux_trade_results/ci_run.log

      - name: Commit scan outputs
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kissing/dim13/ze99_aux_trade_results kissing/dim13/ze99_aux_trade_progress.log
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Scan one-for-two ZE99 auxiliary trades [skip ze99 trade]'
          git pull --rebase origin codex/d13-packingstar-exact
          git push origin HEAD:codex/d13-packingstar-exact
